<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D8D9DC"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#15161A"/>

  <!-- App Mobile -->
  <rect x="30" y="60" width="200" height="90" rx="10" fill="#2A1B12" stroke="#FB8200" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#F2F2F3">App Mobile</text>
  <text x="130" y="120" text-anchor="middle" font-size="12" fill="#D8D9DC">React Native + Expo</text>
  <text x="130" y="138" text-anchor="middle" font-size="11" fill="#8B8C90">nunca fala com a IXC direto</text>

  <!-- Backend outer box -->
  <rect x="290" y="20" width="330" height="500" rx="12" fill="#1C1D21" stroke="#D8D9DC" stroke-width="1.5"/>
  <text x="455" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#F2F2F3">Backend FastAPI</text>

  <!-- api/routes -->
  <rect x="315" y="60" width="280" height="46" rx="8" fill="#2A1B12" stroke="#FB8200" stroke-width="1.5"/>
  <text x="455" y="88" text-anchor="middle" font-size="12.5" fill="#F2F2F3">api/routes — chat, identification, health</text>

  <!-- services -->
  <rect x="315" y="118" width="280" height="46" rx="8" fill="#2A1B12" stroke="#FB8200" stroke-width="1.5"/>
  <text x="455" y="146" text-anchor="middle" font-size="12.5" fill="#F2F2F3">services/ — chat_service, identification, support_flow</text>

  <!-- services/ai -->
  <rect x="315" y="176" width="280" height="70" rx="8" fill="#331F10" stroke="#F84B03" stroke-width="2"/>
  <text x="455" y="197" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F2F2F3">services/ai/</text>
  <text x="455" y="215" text-anchor="middle" font-size="11" fill="#D8D9DC">ollama_client · mcp_client · classifier</text>
  <text x="455" y="230" text-anchor="middle" font-size="11" fill="#D8D9DC">prompts · tool_schema</text>

  <!-- integrations -->
  <rect x="315" y="258" width="280" height="60" rx="8" fill="#2A1B12" stroke="#FB8200" stroke-width="1.5"/>
  <text x="455" y="280" text-anchor="middle" font-size="12.5" fill="#F2F2F3">integrations/</text>
  <text x="455" y="298" text-anchor="middle" font-size="11" fill="#D8D9DC">ixc/client · mcp_server</text>

  <!-- core -->
  <rect x="315" y="330" width="280" height="46" rx="8" fill="#232326" stroke="#5B5C61" stroke-width="1.5"/>
  <text x="455" y="358" text-anchor="middle" font-size="12" fill="#D8D9DC">core/ — config, logging, session_store (memória)</text>

  <!-- domain -->
  <rect x="315" y="388" width="280" height="40" rx="8" fill="#232326" stroke="#5B5C61" stroke-width="1.5"/>
  <text x="455" y="412" text-anchor="middle" font-size="12" fill="#D8D9DC">domain/ — Customer, Department, SupportStage...</text>

  <!-- MCP server subprocess -->
  <rect x="315" y="444" width="280" height="60" rx="8" fill="#2A1B12" stroke="#FB8200" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="455" y="466" text-anchor="middle" font-size="12" fill="#F2F2F3">mcp_server (subprocess, stdio)</text>
  <text x="455" y="484" text-anchor="middle" font-size="11" fill="#8B8C90">identify_customer, get_boleto, list_plans...</text>

  <!-- Ollama Cloud -->
  <rect x="670" y="176" width="200" height="70" rx="10" fill="#331F10" stroke="#F84B03" stroke-width="2"/>
  <text x="770" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#F2F2F3">Ollama Cloud</text>
  <text x="770" y="224" text-anchor="middle" font-size="11" fill="#8B8C90">tool-calling, gratuito</text>

  <!-- IXC API -->
  <rect x="670" y="258" width="200" height="70" rx="10" fill="#2A1B12" stroke="#FB8200" stroke-width="2"/>
  <text x="770" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#F2F2F3">IXC API</text>
  <text x="770" y="304" text-anchor="middle" font-size="11" fill="#8B8C90">demo.ixcsoft.com.br</text>

  <!-- Arrows -->
  <line x1="230" y1="105" x2="290" y2="80" stroke="#D8D9DC" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <text x="238" y="70" font-size="11" fill="#8B8C90">HTTPS / JSON</text>

  <line x1="595" y1="205" x2="668" y2="205" stroke="#D8D9DC" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <line x1="595" y1="290" x2="668" y2="290" stroke="#D8D9DC" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <text x="900" y="550" text-anchor="end" font-size="10.5" fill="#5B5C61">DBS TELECOM — Assistente Virtual</text>
</svg>
